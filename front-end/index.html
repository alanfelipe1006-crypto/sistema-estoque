<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Estoque</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main>
        <!-- seção de login fi-->
         <section id="login">
            <header>
                <h1>Acesso ao Estoque</h1>
                <h2>Faça Login Para Acessar o Estoque:</h2>
            </header>

            <form id="form-login">
                <div class="campodousuario">
                    <label for="usuario">Usuário:</label>
                    <input type="text" id="usuario" name="usuario" placeholder="Digite seu usuário"
                    required>
                </div>

                <div class="campodesenha">
                    <label for="senha">Senha:</label>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha"
                    required>
                </div>

                <button type="submit" class="botaologin">Entrar no Sistema</button>
            </form>
         </section>
    </main>
    
</body>
</html>
